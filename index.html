<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Daily Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Fortnite Item Shop</h1>
        <p>Current daily items and bundles</p>
    </header>

    <main>
        <!-- This will show while the API is loading -->
        <div id="loader" class="loader">Loading shop data...</div>
        
        <!-- JavaScript will insert the item cards here -->
        <div id="shop-container" class="shop-grid"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
